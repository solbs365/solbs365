name: Generate Pac-Man Game

on:
  # Se ejecuta automáticamente todos los días a medianoche
  schedule:
    - cron: "0 0 * * *" 
  # Permite ejecutarlo manualmente desde la pestaña "Actions"
  workflow_dispatch:
  # Se ejecuta cada vez que haces un push a la rama principal
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          # Toma el nombre de usuario automáticamente
          github_user_name: ${{ github.repository_owner }}
          
      - name: Push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          # Guarda la imagen en una rama separada para no ensuciar el código principal
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
